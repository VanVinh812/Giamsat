<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Điểm Rèn Luyện - Lớp 66.DDT-3</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --primary:#1a3a5c; --primary-light:#2563a8; --accent:#f59e0b; --success:#10b981; --danger:#ef4444; --warning:#f97316; --bg:#f0f4f8; --surface:#fff; --text:#1e293b; --text2:#64748b; --shadow:0 1px 3px rgba(0,0,0,.08); }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);padding:20px}
#app{max-width:800px;margin:0 auto}
.card{background:var(--surface);padding:20px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px}
.tab-btn{padding:10px 20px;border:none;background:#e2e8f0;border-radius:8px;cursor:pointer;margin-right:10px}
.tab-btn.active{background:var(--primary);color:#fff}
input, button{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px}
button{background:var(--primary);color:#fff;cursor:pointer;font-weight:600}
</style>
</head>
<body>

<div id="login-page" style="max-width:400px;margin:100px auto;text-align:center">
    <h2>Đăng nhập Lớp 66.DDT-3</h2>
    <input type="text" id="mssv" placeholder="MSSV">
    <input type="password" id="pass" placeholder="Mật khẩu (abc+MSSV)">
    <button onclick="doLogin()">Đăng nhập</button>
</div>

<div id="app" style="display:none">
    <div class="card">
        <h3>Điểm danh</h3>
        <input type="text" id="event" placeholder="Tên sự kiện">
        <button onclick="submit()">Gửi xác nhận</button>
    </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx2QkD4Hy1foicN2Wh1exl06pRp99lhygwIEzxQBbiiUSWll2WWQ0r8S_r0advbBoBR/exec';
let currentUser = null;

function doLogin() {
    const mssv = document.getElementById('mssv').value;
    const pass = document.getElementById('pass').value;
    if (pass === 'abc' + mssv) {
        currentUser = { mssv };
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    } else {
        alert('Sai thông tin!');
    }
}

async function submit() {
    const event = document.getElementById('event').value;
    const url = `${API_URL}?action=checkin&mssv=${currentUser.mssv}&event=${encodeURIComponent(event)}&date=${new Date().toISOString().split('T')[0]}`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        if(data.success) alert('Điểm danh thành công!');
        else alert('Lỗi: ' + data.error);
    } catch(e) {
        alert('Lỗi kết nối!');
    }
}
</script>
</body>
</html>
